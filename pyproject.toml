[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synctask-assistant"
version = "0.1.0"
description = "Read-only Firestore query assistant backend for SyncTask (local Ollama model)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "firebase-admin>=6.5",
    "ollama>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tzdata>=2024.1", 
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]
